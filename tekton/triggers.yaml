# Webhook-driven builds: point a GitHub push webhook at the EventListener
# route to build on every push to main.
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: budgeit-push
  namespace: budge-it-ci
spec:
  params:
    - name: git-url
      value: $(body.repository.clone_url)
    - name: git-revision
      value: $(body.after)
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: budgeit-build
  namespace: budge-it-ci
spec:
  params:
    - name: git-url
    - name: git-revision
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: budgeit-build-
      spec:
        pipelineRef:
          name: budgeit-build
        params:
          - name: git-url
            value: $(tt.params.git-url)
          - name: git-revision
            value: $(tt.params.git-revision)
          - name: image-tag
            value: $(tt.params.git-revision)
        workspaces:
          - name: source
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 1Gi
---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: budgeit
  namespace: budge-it-ci
spec:
  serviceAccountName: pipeline
  triggers:
    - name: on-push
      bindings:
        - ref: budgeit-push
      template:
        ref: budgeit-build
