# Manual run:  oc create -f tekton/pipelinerun-example.yaml
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: budgeit-build-
  namespace: budge-it-ci
spec:
  pipelineRef:
    name: budgeit-build
  params:
    - name: git-url
      value: https://github.com/your-org/budge-it.git
    - name: git-revision
      value: main
    # version defaults to "latest", meaning no extra tag is stamped; set it
    # (e.g. to a commit SHA) to also tag both images with that version.
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
