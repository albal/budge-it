# OpenShift Pipelines (Tekton) build: clone -> test -> build both images with
# Buildah -> promote. Every build pushes :latest (which the Deployments run)
# and, when a version is given, tags the same manifest with it via `oc tag`
# for traceability/rollback, then restarts the Deployments so the new :latest
# rolls out. Tasks are resolved from the cluster (OpenShift Pipelines ships
# git-clone and buildah as cluster resolver tasks).
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: budgeit-build
  namespace: budge-it-ci
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    # The Pipeline CRD is installed by the wave -1 Subscription during this
    # same sync; skip the pre-sync dry-run so the unknown kind doesn't abort
    # the whole operation (same pattern as the PostgresCluster).
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  params:
    - name: git-url
      type: string
      description: Repository with the application source and manifests
    - name: git-revision
      type: string
      default: main
    - name: image-registry
      type: string
      default: image-registry.openshift-image-registry.svc:5000/budge-it
    - name: version
      type: string
      default: latest
      description: >-
        Extra tag to stamp on both images alongside :latest (the webhook
        passes the commit SHA). "latest" means no extra tag.
  workspaces:
    - name: source
  tasks:
    - name: fetch-source
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: git-clone
          - name: namespace
            value: openshift-pipelines
      params:
        - name: URL
          value: $(params.git-url)
        - name: REVISION
          value: $(params.git-revision)
      workspaces:
        - name: output
          workspace: source

    - name: test-backend
      runAfter: [fetch-source]
      workspaces:
        - name: source
          workspace: source
      taskSpec:
        workspaces:
          - name: source
        steps:
          - name: go-test
            image: registry.access.redhat.com/ubi9/go-toolset:latest
            workingDir: $(workspaces.source.path)/backend
            script: |
              #!/bin/sh
              set -e
              go vet ./...
              go test ./...

    - name: build-backend
      runAfter: [test-backend]
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: buildah
          - name: namespace
            value: openshift-pipelines
      params:
        - name: IMAGE
          value: $(params.image-registry)/budgeit-backend:latest
        - name: CONTEXT
          value: backend
        - name: DOCKERFILE
          value: backend/Dockerfile
        # The internal registry serves a service-CA cert that isn't in the
        # build container's trust store.
        - name: TLS_VERIFY
          value: "false"
        # Stamp the binary with the commit so /api/v1/version reports it.
        - name: BUILD_EXTRA_ARGS
          value: --build-arg VERSION=$(params.version)
      workspaces:
        - name: source
          workspace: source

    - name: build-frontend
      runAfter: [test-backend]
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: buildah
          - name: namespace
            value: openshift-pipelines
      params:
        - name: IMAGE
          value: $(params.image-registry)/budgeit-frontend:latest
        - name: CONTEXT
          value: frontend
        - name: DOCKERFILE
          value: frontend/Dockerfile
        - name: TLS_VERIFY
          value: "false"
      workspaces:
        - name: source
          workspace: source

    - name: promote
      runAfter: [build-backend, build-frontend]
      params:
        - name: version
          value: $(params.version)
      taskSpec:
        params:
          - name: version
        steps:
          - name: tag-and-rollout
            # Every cluster ships the cli imagestream in the openshift
            # namespace, pullable by all authenticated serviceaccounts.
            image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
            script: |
              #!/bin/sh
              set -e
              if [ "$(params.version)" != "latest" ]; then
                oc tag budge-it/budgeit-backend:latest "budge-it/budgeit-backend:$(params.version)"
                oc tag budge-it/budgeit-frontend:latest "budge-it/budgeit-frontend:$(params.version)"
              fi
              oc rollout restart deployment/budgeit-backend deployment/budgeit-frontend -n budge-it
