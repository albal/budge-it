# Public entrypoint for GitHub push webhooks. The Triggers controller
# generates the el-budgeit Service for the EventListener of the same name.
# Point the repository's webhook (push events, content type application/json)
# at https://<this route's host>/.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: budgeit-ci-webhook
  namespace: budge-it-ci
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  to:
    kind: Service
    name: el-budgeit
  port:
    targetPort: http-listener
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
