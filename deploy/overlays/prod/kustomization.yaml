apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: budge-it

resources:
  - ../../base

# Production tracks immutable image digests/tags promoted by the Tekton
# pipeline (updated via `kustomize edit set image` in CI).
images:
  - name: image-registry.openshift-image-registry.svc:5000/budge-it/budgeit-backend
    newTag: latest
  - name: image-registry.openshift-image-registry.svc:5000/budge-it/budgeit-frontend
    newTag: latest
