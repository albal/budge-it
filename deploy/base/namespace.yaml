apiVersion: v1
kind: Namespace
metadata:
  name: budge-it
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    # Enables user-workload monitoring scrape targets in this namespace
    openshift.io/cluster-monitoring: "false"
    # Tells the OpenShift GitOps operator to grant its Argo CD
    # application-controller RBAC in this namespace; without it every
    # create is forbidden and the sync fails.
    argocd.argoproj.io/managed-by: openshift-gitops
