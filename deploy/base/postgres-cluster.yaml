# Crunchy Data Postgres Operator (or the Red Hat build) provisions an HA
# PostgreSQL cluster with automated backups from this single CR.
# The operator generates the connection secret budgeit-db-pguser-budgeit,
# whose `uri` key the backend consumes as DATABASE_URL.
apiVersion: postgres-operator.crunchydata.com/v1beta1
kind: PostgresCluster
metadata:
  name: budgeit-db
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    # The PostgresCluster CRD is installed by the wave -1 Subscription during
    # this same sync. Without this option Argo's pre-sync dry-run fails on the
    # unknown kind and aborts the whole sync before the Subscription is ever
    # applied, deadlocking the app on "CRD not installed".
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  postgresVersion: 16
  instances:
    - name: instance1
      replicas: 2
      dataVolumeClaimSpec:
        # Explicit class: this cluster has no default StorageClass, and a
        # class-less PVC stays Pending forever.
        storageClassName: ocs-storagecluster-ceph-rbd
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          memory: 1Gi
  users:
    - name: budgeit
      databases:
        - budgeit
  # Postgres 15+ blocks non-owners from creating objects in the public
  # schema; this init SQL hands the database and schema to the app user.
  databaseInitSQL:
    name: budgeit-db-init-sql
    key: init.sql
  backups:
    pgbackrest:
      repos:
        - name: repo1
          schedules:
            full: "0 1 * * 0"        # weekly full backup, Sunday 01:00
            differential: "0 1 * * 1-6"
          volume:
            volumeClaimSpec:
              storageClassName: ocs-storagecluster-ceph-rbd
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 10Gi
  monitoring:
    pgmonitor:
      exporter: {}
