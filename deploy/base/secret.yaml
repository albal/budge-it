# Placeholder only — set the real values with an external secret manager or:
#   oc -n budge-it create secret generic budgeit-secrets \
#     --from-literal=OCR_API_KEY=<key> \
#     --from-literal=SESSION_SECRET=<openssl rand -hex 32> \
#     --dry-run=client -o yaml | oc apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: budgeit-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  OCR_API_KEY: "CHANGE_ME"
  # Signs login session cookies. Must be identical across every backend
  # replica (the HPA can run 2-10 pods) and kept secret — anyone with it can
  # forge a session for any user.
  SESSION_SECRET: "CHANGE_ME"
