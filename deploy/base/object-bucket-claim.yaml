# OpenShift Data Foundation / Multi-Cloud Object Gateway (NooBaa) provisions
# an S3-compatible bucket from this claim and generates:
#   - ConfigMap budgeit-uploads: BUCKET_HOST, BUCKET_PORT, BUCKET_NAME
#   - Secret    budgeit-uploads: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
# The backend Deployment consumes both via envFrom. Uploaded statements are
# staged here and purged immediately after extraction.
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: budgeit-uploads
spec:
  generateBucketName: budgeit-uploads
  storageClassName: openshift-storage.noobaa.io
