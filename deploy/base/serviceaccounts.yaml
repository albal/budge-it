# Dedicated service accounts with no RBAC grants: neither workload talks to
# the Kubernetes API, so the precise permission set is "none", and tokens are
# not mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: budgeit-backend
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: budgeit-frontend
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
automountServiceAccountToken: false
