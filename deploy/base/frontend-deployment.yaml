apiVersion: apps/v1
kind: Deployment
metadata:
  name: budgeit-frontend
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app: budgeit-frontend
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: budgeit-frontend
  template:
    metadata:
      labels:
        app: budgeit-frontend
    spec:
      serviceAccountName: budgeit-frontend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: image-registry.openshift-image-registry.svc:5000/budge-it/budgeit-frontend:latest
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
