apiVersion: apps/v1
kind: Deployment
metadata:
  name: budgeit-backend
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app: budgeit-backend
    app.kubernetes.io/component: api
spec:
  # No `replicas`: the HorizontalPodAutoscaler owns the replica count.
  selector:
    matchLabels:
      app: budgeit-backend
  template:
    metadata:
      labels:
        app: budgeit-backend
    spec:
      serviceAccountName: budgeit-backend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: image-registry.openshift-image-registry.svc:5000/budge-it/budgeit-backend:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  # Generated by the Crunchy operator for the PostgresCluster
                  name: budgeit-db-pguser-budgeit
                  key: uri
          envFrom:
            # BUCKET_HOST / BUCKET_PORT / BUCKET_NAME from the OBC
            - configMapRef:
                name: budgeit-uploads
            # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY from the OBC
            - secretRef:
                name: budgeit-uploads
            - configMapRef:
                name: budgeit-config
            - secretRef:
                name: budgeit-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
