# Login credentials for the pgAdmin web UI itself (the master account you use
# to sign in to pgAdmin — NOT the PostgreSQL credentials).
#
# This file ships a placeholder; keep the real password out of git. Either
# apply this file after editing it locally, or create the secret imperatively:
#   oc -n pgadmin create secret generic pgadmin-login \
#     --from-literal=email='al@tsew.net' \
#     --from-literal=password='<CHOOSE_A_STRONG_PASSWORD>'
#
# The pgadmin Argo Application ignores this Secret's /data so selfHeal never
# reverts your real password back to the placeholder.
apiVersion: v1
kind: Secret
metadata:
  name: pgadmin-login
  namespace: pgadmin
  annotations:
    argocd.argoproj.io/sync-wave: "0"
type: Opaque
stringData:
  email: "al@tsew.net"
  password: "PASTE_A_STRONG_PASSWORD_HERE"
