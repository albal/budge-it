# Runs in the budge-it namespace (not budge-it-loadsim) because it needs the
# Crunchy-generated database secret, and Secrets can't be read across
# namespaces. Deletes simulated @void.com accounts more than two hours old,
# directly in PostgreSQL. The postgres-ingress NetworkPolicy explicitly
# allows pods labelled app=budgeit-cleanup to reach the database.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: budgeit-loadsim-cleanup
  namespace: budge-it
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: budgeit-cleanup
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: cleanup
              image: registry.redhat.io/rhel9/postgresql-16:latest
              command:
                - /bin/bash
                - -euo
                - pipefail
                - -c
                - psql "$DATABASE_URL" -f /sql/cleanup.sql
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      # Generated by the Crunchy operator for the PostgresCluster
                      name: budgeit-db-pguser-budgeit
                      key: uri
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: sql
                  mountPath: /sql
                  readOnly: true
          volumes:
            - name: sql
              configMap:
                name: budgeit-loadsim-cleanup-sql
