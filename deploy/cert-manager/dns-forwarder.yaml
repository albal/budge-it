# DNS-over-TLS forwarder for cert-manager's DNS-01 self-checks.
#
# Why: the lab router transparently intercepts ALL port-53 traffic and
# answers from the local split-horizon resolver (authoritative for
# lab.tsew.net, so it never sees the _acme-challenge TXT records published
# in Cloudflare). Port 853 (DoT) passes through untouched and is
# TLS-authenticated, so it cannot be intercepted.
#
# cert-manager's --dns01-recursive-nameservers points at this Service's
# ClusterIP; CoreDNS forwards every query to Cloudflare over DoT.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dns01-forwarder
  namespace: cert-manager
data:
  Corefile: |
    .:5353 {
        errors
        forward . tls://1.1.1.1 tls://1.0.0.1 {
            tls_servername cloudflare-dns.com
            health_check 10s
        }
        cache 30
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns01-forwarder
  namespace: cert-manager
  labels:
    app: dns01-forwarder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dns01-forwarder
  template:
    metadata:
      labels:
        app: dns01-forwarder
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: coredns
          image: registry.k8s.io/coredns/coredns:v1.11.3
          args: ["-conf", "/etc/coredns/Corefile"]
          ports:
            - name: dns-udp
              containerPort: 5353
              protocol: UDP
            - name: dns-tcp
              containerPort: 5353
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/coredns
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            # The coredns binary carries a cap_net_bind_service file
            # capability; with NoNewPrivs (allowPrivilegeEscalation:false) the
            # kernel refuses to exec it ("Operation not permitted"). Allowing
            # escalation lets it start; it still runs non-root and drops ALL
            # capabilities, and binds only the unprivileged port 5353.
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: dns01-forwarder
---
apiVersion: v1
kind: Service
metadata:
  name: dns01-forwarder
  namespace: cert-manager
  labels:
    app: dns01-forwarder
spec:
  selector:
    app: dns01-forwarder
  ports:
    - name: dns-udp
      port: 53
      targetPort: 5353
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: 5353
      protocol: TCP
