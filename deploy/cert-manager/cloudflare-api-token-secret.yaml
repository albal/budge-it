# Cloudflare API token used by cert-manager for DNS-01 validation.
#
# Create the token in the Cloudflare dashboard (My Profile → API Tokens →
# Create Token) with these permissions:
#   - Zone / Zone / Read        (All zones, or just tsew.net)
#   - Zone / DNS  / Edit        (zone: tsew.net)
#
# Then paste it below and apply:
#   oc apply -f deploy/cert-manager/cloudflare-api-token-secret.yaml
#
# NOTE: keep the real token out of git — apply this file locally or create
# the secret imperatively:
#   oc -n cert-manager create secret generic cloudflare-api-token \
#     --from-literal=api-token='<YOUR_TOKEN>'
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token
  # The ClusterIssuer's solver reads referenced secrets from the namespace
  # cert-manager runs in (the operator's default: cert-manager).
  namespace: cert-manager
type: Opaque
stringData:
  api-token: "PASTE_CLOUDFLARE_API_TOKEN_HERE"
