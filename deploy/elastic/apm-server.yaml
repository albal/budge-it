# Elastic APM Server: the OTLP ingest endpoint for the budge-it backend's
# OpenTelemetry traces and metrics (OTLP/HTTP on port 8200), writing them to
# Elasticsearch as traces-apm* / metrics-apm* data streams.
apiVersion: apm.k8s.elastic.co/v1
kind: ApmServer
metadata:
  name: budgeit
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    # See elasticsearch.yaml: required while the ECK CRDs are absent.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  version: 8.17.4
  count: 1
  elasticsearchRef:
    name: budgeit
  kibanaRef:
    name: budgeit
  http:
    tls:
      # Plain HTTP in-cluster: the backend authenticates with the secret
      # token, and the budge-it NetworkPolicy restricts who can reach it.
      selfSignedCertificate:
        disabled: true
  # secureSettings alone only loads the value into the APM Server keystore;
  # without this explicit config reference, ECK instead auto-generates and
  # wires up its own random secret token (in a `budgeit-apm-token` Secret it
  # manages), which the backend has no way to learn. This `${...}` reference
  # is Beats-style keystore substitution: it must match the secureSettings
  # secret's key name exactly, and the resulting value must match
  # ELASTIC_APM_SECRET_TOKEN in the budge-it namespace (see apm-secret-token.yaml
  # and deploy/base/secret.yaml).
  config:
    apm-server.auth.secret_token: "${apm-server.auth.secret_token}"
  secureSettings:
    - secretName: budgeit-apm-secret-token
  podTemplate:
    spec:
      containers:
        - name: apm-server
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 512Mi
