# Placeholder only — rotate with:
#   TOKEN=$(openssl rand -hex 32)
#   oc -n elastic create secret generic budgeit-apm-secret-token \
#     --from-literal=apm-server.auth.secret_token=$TOKEN \
#     --dry-run=client -o yaml | oc apply -f -
#   oc -n budge-it create secret generic budgeit-secrets ... ELASTIC_APM_SECRET_TOKEN=$TOKEN
#
# The key name is an APM Server keystore setting: ECK loads every key of this
# secret (referenced by the ApmServer CR's secureSettings) into the APM
# server keystore, which is how the token becomes the server's expected
# bearer token. The SAME value must be set as ELASTIC_APM_SECRET_TOKEN in the
# budge-it namespace's budgeit-secrets so the backend can authenticate.
apiVersion: v1
kind: Secret
metadata:
  name: budgeit-apm-secret-token
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  apm-server.auth.secret_token: "CHANGE_ME_APM_TOKEN"
