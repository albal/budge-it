# PostSync hook: imports the budge-it dashboard (and its data views /
# visualizations) into Kibana via the saved-objects API. Re-runs on every
# sync with overwrite=true, so the dashboard in git is authoritative.
# Waits for Kibana to come up first — on a fresh install ES + Kibana can
# take several minutes after the CRs are accepted.
apiVersion: batch/v1
kind: Job
metadata:
  name: budgeit-kibana-dashboards
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10
  activeDeadlineSeconds: 1200
  template:
    metadata:
      labels:
        app: budgeit-kibana-dashboards
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: import
          # Full UBI (not minimal): the import needs curl with multipart
          # form support.
          image: registry.access.redhat.com/ubi9/ubi:latest
          env:
            - name: KIBANA_URL
              value: http://budgeit-kb-http:5601
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  # Generated by ECK for the Elasticsearch CR named budgeit
                  name: budgeit-es-elastic-user
                  key: elastic
          command:
            - /bin/bash
            - -euo
            - pipefail
            - -c
            - |
              echo "waiting for Kibana at ${KIBANA_URL}..."
              until curl -fsS -o /dev/null -u "elastic:${ELASTIC_PASSWORD}" \
                  "${KIBANA_URL}/api/status"; do
                sleep 10
              done
              echo "importing saved objects..."
              curl -fsS -X POST \
                -u "elastic:${ELASTIC_PASSWORD}" \
                -H "kbn-xsrf: true" \
                --form file=@/dashboards/budgeit-observability.ndjson \
                "${KIBANA_URL}/api/saved_objects/_import?overwrite=true"
              echo
              echo "dashboard import complete"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: dashboards
              mountPath: /dashboards
              readOnly: true
      volumes:
        - name: dashboards
          configMap:
            name: budgeit-kibana-dashboards
