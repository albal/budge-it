name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # The store tests exercise the first-login administrator claim, including
    # its behaviour under concurrent logins, which needs a real PostgreSQL.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: budgeit
          POSTGRES_PASSWORD: budgeit
          POSTGRES_DB: budgeit
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://budgeit:budgeit@localhost:5432/budgeit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test (race + coverage)
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Build
        run: CGO_ENABLED=0 go build ./...

  frontend:
    name: Frontend (TypeScript + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      # Strict tsc + production bundle is the frontend check; add a test
      # runner step here (e.g. vitest) when component tests land.
      - name: Type-check and build
        run: npm run build

  manifests:
    name: OpenShift manifests (Kustomize)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # kubectl (with the embedded kustomize) ships on ubuntu runners
      - name: Render dev overlay
        run: kubectl kustomize deploy/overlays/dev > /dev/null

      - name: Render prod overlay
        run: kubectl kustomize deploy/overlays/prod > /dev/null

  images:
    name: Container image builds
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only — publishing is owned by the Tekton pipeline in-cluster.
      - name: Build ${{ matrix.component }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          push: false
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max
