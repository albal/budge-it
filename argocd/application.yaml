# OpenShift GitOps (Argo CD) keeps the cluster in sync with the manifests in
# this repository. Apply once to the namespace where the Argo CD instance
# runs (openshift-gitops by default).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: budge-it
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/albal/budge-it.git
    targetRevision: main
    path: deploy/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: budge-it
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false # the base manifests own the Namespace
      - PruneLast=true
    # Resources are ordered into phases via argocd.argoproj.io/sync-wave
    # (namespace -> operator install -> config/secrets -> operator-managed
    # CRs -> workloads). The Crunchy operator's CRD isn't Established the
    # instant its Subscription is applied, so retry with backoff lets the
    # PostgresCluster wave self-heal once OLM finishes installing it instead
    # of leaving the whole sync stuck on the first failed attempt.
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
  ignoreDifferences:
    # The HPA owns backend replicas; don't fight it.
    - group: apps
      kind: Deployment
      name: budgeit-backend
      jsonPointers:
        - /spec/replicas
    # The CI pipeline's promote task uses `oc rollout restart` to roll the
    # Deployments onto the freshly pushed :latest; without this, selfHeal
    # would strip the restart annotation and trigger a second rollout.
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/metadata/annotations/kubectl.kubernetes.io~1restartedAt
